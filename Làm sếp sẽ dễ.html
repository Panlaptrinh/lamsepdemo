.sysbar{position:fixed;left:0;right:0;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:5;max-width:496px;margin:0 auto;width:calc(100% - 16px);display:flex;gap:10px;align-items:center;text-align:left;font:inherit;color:#fff;cursor:pointer;padding:8px 12px;border-radius:14px;border:2.5px solid #4B2FB0;background:linear-gradient(135deg,#8E6BE0,#4B2FB0);box-shadow:0 3px 0 rgba(36,23,90,.55)}

/* ===== ACCOUNT / CLOUD SAVE SYSTEM ===== */
.acc-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  z-index: 950; display: flex; align-items: center;
  justify-content: center; padding: 16px;
  animation: fadeIn .18s ease;
}
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
.acc-card {
  background: var(--surface); border-radius: 20px;
  padding: 24px 20px; max-width: 400px; width: 100%;
  box-shadow: 0 12px 50px rgba(0,0,0,0.35);
  display: flex; flex-direction: column; gap: 14px;
  animation: slideUp .2s ease;
}
@keyframes slideUp { from { transform: translateY(24px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
.acc-title { display: flex; align-items: center; justify-content: space-between; }
.acc-title h2 { margin: 0; font-size: 18px; font-weight: 700; }
.acc-tabs { display: flex; gap: 6px; }
.acc-tabs button { flex: 1; padding: 8px 12px; border-radius: 10px; font: inherit;
  font-size: 14px; font-weight: 600; cursor: pointer; border: 2px solid var(--accent);
  transition: all .15s; }
.acc-tabs button.active { background: var(--accent); color: #fff; }
.acc-tabs button:not(.active) { background: transparent; color: var(--accent); }
.acc-input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--line);
  border-radius: 10px; font: inherit; font-size: 15px;
  background: var(--bg); color: var(--ink);
  transition: border-color .15s; box-sizing: border-box; }
.acc-input:focus { outline: none; border-color: var(--accent); }
.acc-error { color: var(--bad); font-size: 13px; margin: -6px 0; }
.acc-note { color: var(--muted); font-size: 12px; text-align: center; line-height: 1.5; }
.acc-close { background: none; border: none; cursor: pointer;
  font-size: 22px; color: var(--muted); padding: 2px 6px;
  border-radius: 6px; transition: color .15s; }
.acc-close:hover { color: var(--ink); }
.acc-user-badge {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; border-radius: 10px;
  background: var(--surface); border: 1.5px solid var(--line);
  font-size: 13px; cursor: pointer; transition: border-color .15s;
}
.acc-user-badge:hover { border-color: var(--accent); }
.acc-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
.acc-dot.offline { background: var(--muted); }
.sync-spin { display: inline-block; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Tông kem, nâu cà phê, cam mật ong và hồng san hô. Số dùng chữ đơn cách. */
:root {
  --bg: #F6ECDD; --surface: #FFF9EF; --ink: #4A2F27; --muted: #957767; --line: #E7D3B8;
  --coral: #E9A23B; --coral-line: #A8651F; --orange: #D98F3E; --orange-line: #A8651F;
  --green: #4E8F6A; --green-soft: #DFF0E3; --bad: #D4505E; --info: #B8751F; --soft: #F1E1C6;
  --on-color: #fff; --shade: rgba(74,47,39,.55); --edge: #DDC29B; --ring: #E7D3B8; --sky: #F1E1C6;
  --accent: #D96B78; --accent-soft: rgba(217,107,120,.14); --wood: #6B4A3C; --wood-line: #8A604E; --cream: #FFF3D6; --red: #E0707C;
  --font-d: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; font-weight: 400; -webkit-font-smoothing: antialiased; }
#app { max-width: 520px; margin: 0 auto; min-height: 100vh; position: relative; }
/* Khóa bôi đen chữ, chỉ cho phép trong ô nhập */
html, body, #app, #app * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
input, textarea, #app input, #app textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
button { font-family: inherit; }
.pad { padding-inline: 16px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { min-width: 0; }
.between { justify-content: space-between; }
.grow { flex: 1; }
.wrap { flex-wrap: wrap; }
h2 { display: flex; align-items: center; gap: 6px; font-size: 18px; font-weight: 600; letter-spacing: -.01em; margin: 4px 0 0; text-wrap: balance; }
.sub { font-size: 13px; color: var(--muted); font-weight: 400; }
.lab { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.val { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: .92em; }
.pos { color: var(--green); font-weight: 600; }
.neg { color: var(--bad); font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.card .lab { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; letter-spacing: .01em; }
.card .val { font-size: 19px; font-weight: 600; line-height: 1.2; letter-spacing: -.01em; }
.card.pick { cursor: pointer; text-align: left; color: inherit; font: inherit; width: 100%; }
.card.pick:hover { border-color: var(--edge); }
.card.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.card.off { opacity: .5; }
.card.warn { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 6%, var(--surface)); }
.card.gold { border-left: 3px solid var(--accent); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tiles3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ico, .px { vertical-align: -4px; flex: none; }
.big { display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 4px 8px; font-weight: 600; font-size: 15px; color: var(--ink); cursor: pointer; }

.btn { font-family: var(--font); border: 1px solid var(--coral-line); background: var(--coral); color: var(--on-color); font-weight: 600; font-size: 15px; padding: 10px 14px; border-radius: 8px; cursor: pointer; text-align: center; }
.btn:active { transform: translateY(1px); }
.btn:hover:not([disabled]) { filter: brightness(1.08); }
.btn.warm { background: var(--wood); border-color: var(--wood-line); color: var(--cream); }
.btn.green { background: var(--green); border-color: var(--green); color: #06180F; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--edge); }
.btn.ghost:hover:not([disabled]) { background: var(--soft); filter: none; }
.btn.bad { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.sm { font-size: 13.5px; padding: 6px 11px; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn:focus-visible, .card.pick:focus-visible, .tab:focus-visible, .big:focus-visible, .go:focus-visible, input:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }

.bar { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--green); }
.bar i.warm { background: var(--orange); } .bar i.info { background: var(--info); } .bar i.bad { background: var(--bad); }

input[type=text] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }

/* Đầu trang */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); padding: 10px 16px 10px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.avatar { width: 42px; height: 42px; border-radius: 8px; background: transparent; color: var(--coral); overflow: hidden; display: flex; align-items: center; justify-content: center; flex: none; font-weight: 600; font-size: 16px; letter-spacing: .02em; }
.sq { width: 34px; height: 34px; border-radius: 8px; background: var(--coral); border: 1px solid var(--coral-line); color: var(--on-color); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex: none; }
.sq.alt { background: transparent; color: var(--muted); border-color: var(--edge); }
.who { display: flex; align-items: center; gap: 6px; font-size: 17px; line-height: 1.15; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.chip { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 2px; font-family: var(--mono); font-size: 12.5px; font-weight: 500; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 4px; color: var(--ink); }
.chip svg { color: var(--muted); }
.meters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.meter { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px 7px; display: flex; flex-direction: column; gap: 5px; }
.meter b { white-space: nowrap; gap: 4px; font-family: var(--mono); font-size: 13.5px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; font-variant-numeric: tabular-nums; }
.meter b svg { color: var(--muted); }
.clock { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.clock .t { font-family: var(--mono); font-size: 22px; line-height: 1; color: var(--ink); font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 5px; background: var(--green-soft); color: var(--green); border-radius: 999px; padding: 2px 10px 2px 7px; font-size: 12px; font-weight: 600; }
.pill.end { background: var(--soft); color: var(--muted); }
.pill.ot { background: rgba(252,180,12,.16); color: var(--coral); }

.content { padding: 12px 16px 110px; display: flex; flex-direction: column; gap: 8px; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding: 4px 8px calc(4px + env(safe-area-inset-bottom, 0px)); max-width: 520px; margin: 0 auto; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { background: none; border: 0; padding: 6px 2px 4px; font-size: 12px; font-weight: 500; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; border-radius: 8px; position: relative; }
.tab svg { width: 24px; height: 24px; }
.tab.on { color: var(--coral); font-weight: 600; }
.tab.on::before { content: ''; position: absolute; top: -5px; left: 30%; right: 30%; height: 2px; background: var(--coral); border-radius: 2px; }
.go { position: relative; flex: none; min-width: 108px; border-radius: 8px; border: 1px solid var(--coral-line); background: var(--coral); color: var(--on-color); font-weight: 600; font-size: 14px; line-height: 1.15; white-space: nowrap; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 6px 12px; user-select: none; -webkit-user-select: none; touch-action: manipulation; -webkit-touch-callout: none; }
.go small { font-family: var(--mono); font-size: 11px; font-weight: 400; opacity: .8; }
.go:active { transform: translateY(1px); }
.go[disabled] { opacity: .45; }
.go.on { background: var(--wood); color: var(--cream); border-color: var(--wood-line); }

.toast { position: fixed; left: 16px; right: 16px; bottom: 76px; max-width: 488px; margin: 0 auto; z-index: 8; background: var(--coral); color: var(--on-color); padding: 10px 13px; border-radius: 8px; font-size: 13.5px; font-weight: 500; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.toast[hidden] { display: none; }
.modal { position: fixed; inset: 0; z-index: 10; background: var(--shade); display: flex; align-items: center; justify-content: center; padding: 16px; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.sheet p { margin: 0; line-height: 1.55; }

/* Màn hình bắt đầu */
.logo { display: flex; justify-content: center; margin-bottom: 4px; }
.logo img { width: min(78vw, 360px); height: auto; display: block; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; transform-origin: 52% 25%; transform: scale(2.7); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .16em; color: var(--accent); text-transform: uppercase; }
.title { font-size: clamp(40px, 12vw, 58px); line-height: 1; font-weight: 700; letter-spacing: -.03em; margin: 0; }
.title em { font-style: normal; color: var(--coral); display: block; }
.ver { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 8px; font-family: var(--mono); letter-spacing: 0; vertical-align: super; }
.scene { flex: 1; min-height: 160px; max-height: 300px; display: flex; align-items: flex-end; margin: -24px -16px 0; background: linear-gradient(var(--sky), var(--bg) 96%); }
.scene svg { width: 100%; height: auto; display: block; }
.sparkbars { display: flex; align-items: flex-end; gap: 2px; height: 56px; margin: 6px 0; }
.sparkbars i { flex: 1; background: var(--edge); border-radius: 1px; min-height: 4px; }
.sparkbars i:last-child { background: var(--accent); }

/* Tab con, bảng dòng, biểu đồ */
.pills { display: flex; gap: 2px; overflow-x: auto; padding: 0 16px; margin-inline: -16px; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.pills::-webkit-scrollbar { display: none; }
.pillb { flex: none; font-weight: 500; font-size: 14px; padding: 8px 12px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); cursor: pointer; margin-bottom: -1px; }
.pillb.on { color: var(--coral); border-bottom-color: var(--coral); font-weight: 600; }
.pillb:focus-visible { outline: 2px solid var(--info); outline-offset: -2px; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.kv:last-child { border-bottom: 0; }
.kv span { color: var(--muted); }
.kv b { font-weight: 500; font-family: var(--mono); font-size: 13.5px; font-variant-numeric: tabular-nums; text-align: right; }
.ok { color: var(--green); font-weight: 600; } .no { color: var(--bad); font-weight: 600; }
.chart { display: flex; align-items: flex-end; justify-content: space-around; height: 150px; padding: 6px 4px 0; border-bottom: 1px solid var(--edge); gap: 6px; background: repeating-linear-gradient(to top, transparent 0, transparent 36px, var(--line) 36px, var(--line) 37px); }
.chart .g { display: flex; align-items: flex-end; gap: 3px; height: 100%; }
.chart .g i { width: 18px; border-radius: 2px 2px 0 0; display: block; min-height: 2px; }
.chart .in { background: var(--green); } .chart .out { background: var(--bad); opacity: .85; }
.xl { display: flex; justify-content: space-around; font-size: 11.5px; font-family: var(--mono); color: var(--muted); padding-top: 4px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
.speed { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.speed { flex: 1; }
.spd { flex: 1; min-width: 0; height: 32px; border: 0; border-right: 1px solid var(--line); background: var(--surface); font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--muted); cursor: pointer; padding: 0 8px; }
.spd:last-child { border-right: 0; font-family: var(--font); flex: 2.2; white-space: nowrap; font-size: 11.5px; }
.spd.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.timeline { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.ctl { display: flex; gap: 8px; align-items: stretch; }
.mini { font-size: 12px; color: var(--muted); }
.warnbar { background: color-mix(in srgb, var(--bad) 10%, var(--surface)); color: var(--bad); border: 1px solid var(--bad); border-radius: 8px; padding: 6px 9px; font-size: 13px; font-weight: 500; }
.menug { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mt { position: relative; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 10px; min-height: 92px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; color: var(--ink); font: inherit; cursor: pointer; text-align: left; }
.mt svg { width: 26px; height: 26px; color: var(--coral); }
.mt span { font-weight: 600; font-size: 14px; line-height: 1.2; }
.mt small { font-size: 11px; color: var(--muted); font-family: var(--mono); }
.mt:hover:not(.off) { border-color: var(--wood-line); background: var(--accent-soft); }
.mt.off { opacity: .5; cursor: default; }
.mt.off svg { color: var(--muted); }
.mt:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.mt:active:not(.off) { transform: translateY(1px); }
.dotb { position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
.acc { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.acc.open { border-color: var(--accent); }
.acch { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 12px; background: none; border: 0; color: var(--ink); font-weight: 600; font-size: 15px; text-align: left; cursor: pointer; }
.acch svg { color: var(--coral); }
.acch span { flex: 1; }
.acch:focus-visible { outline: 2px solid var(--info); outline-offset: -2px; }
.chev { font-style: normal; color: var(--muted); }
.accb { padding: 0 12px 12px 44px; line-height: 1.55; font-size: 14.5px; color: var(--ink); }
.ff { position: fixed; right: 14px; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); z-index: 5; width: 84px; height: 84px; border-radius: 50%; border: 3px solid var(--cream); background: var(--red); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; box-shadow: 0 6px 16px rgba(43,26,10,.3); font: inherit; cursor: pointer; }
.ff .ffl { display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11.5px; line-height: 1.15; text-align: center; }

.ff .fft { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; opacity: .95; }
.ff:active { transform: scale(.96); }
@media (min-width: 521px) { .ff { right: calc(50% - 260px + 14px); } }
.btn:not(.ghost):not(.small) { box-shadow: 0 3px 0 var(--wood); }
.ff { box-shadow: 0 4px 0 #A94A58, 0 8px 16px rgba(74,47,39,.25); }

/* ===== Giao diện theo ảnh mẫu: nền kem, viền nâu dày, thẻ bo tròn, nút tròn giữa ===== */
:root{--outline:#5C3D31;--card-line:#E6D2B3;--bg:#F4E8D5;--surface:#FFFAF0;--hdr:#FCF6E9;--tan:#9A7B69;--gold:#E8B63A;
  --font:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--font-d:var(--font);--mono:'Nunito',system-ui,-apple-system,sans-serif}
body{font-family:var(--font);font-weight:700;font-size:15px}
.emo{display:inline-flex;align-items:center;justify-content:center;line-height:1;font-style:normal;flex:none;vertical-align:-3px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
h2{font-size:20px;font-weight:900;margin:2px 0 0}
.sub,.lab{font-weight:700}

/* Đầu trang */
.top{background:var(--hdr);padding:10px 14px 10px;gap:10px;border-bottom:2px solid var(--card-line)}
.hdr{display:flex;align-items:center;gap:8px}
.avwrap{position:relative;flex:none;width:44px;height:44px}
.avwrap .avatar{width:44px;height:44px;border-radius:11px;border:3px solid var(--outline);background:#CFE0F2;box-shadow:0 2px 0 var(--outline)}
.age{position:absolute;left:-8px;top:-7px;z-index:1;background:#D4505E;color:#fff;font-size:11px;font-weight:900;line-height:1.2;padding:1px 5px;border-radius:8px;border:2px solid #fff}
.hcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.who{font-size:17px;font-weight:900;min-width:0;gap:2px;flex:1 1 auto}
.who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pen{background:none;border:0;padding:0 4px;color:var(--ink);font-size:15px;cursor:pointer;line-height:1}
.datebtn{background:none;border:0;padding:0;font:inherit;font-size:13px;font-weight:700;color:var(--tan);white-space:nowrap;cursor:pointer;flex:none}
.spdtag{margin-left:4px;color:#fff;background:var(--outline);border-radius:8px;padding:0 5px;font-size:11px;font-weight:900}
.sub2{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:700;color:var(--tan);white-space:nowrap;min-width:0}
.sub2 .rt{overflow:hidden;text-overflow:ellipsis;min-width:0}.sub2 .rc{flex:none}
.sq3,.top .go,.top .go.on{width:34px;height:34px;min-width:0;padding:0;flex:none;display:flex;align-items:center;justify-content:center;border-radius:11px;border:3px solid var(--outline);background:#FFF6E6;color:var(--ink);box-shadow:0 3px 0 var(--outline);cursor:pointer;font-size:17px;line-height:1;white-space:nowrap}
.top .go .pz{font-size:12px;font-weight:900;letter-spacing:-.1em}
.top .go:active,.sq3:active{transform:translateY(2px);box-shadow:0 1px 0 var(--outline)}
.chips{gap:8px}
.chip{background:#FFF8EA;border:3px solid var(--outline);border-bottom-width:4px;border-radius:14px;padding:3px 2px;font-family:var(--font);font-size:14.5px;font-weight:900;gap:3px;min-width:0;overflow:hidden}
.meters{gap:8px}
.meter{background:var(--surface);border:2px solid var(--card-line);border-radius:16px;padding:6px 12px 9px;gap:6px}
.meter b{font-family:var(--font);font-size:19px;font-weight:900}
.bar{height:7px;border-radius:4px;background:#EFE0C6}
.bar i{background:#5B9B78;border-radius:4px}
.bar i.warm{background:#D99A3C}.bar i.gold{background:var(--gold)}.bar i.bad{background:var(--bad)}
.timeline{flex-wrap:nowrap;gap:10px;font-weight:800;color:var(--tan)}
.timeline .lvl{white-space:nowrap;font-size:15px}
.timeline .cl{font-family:var(--font);font-size:34px;font-weight:900;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.timeline .nxt{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{margin-left:auto;flex:0 1 auto;min-width:0;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:2px solid #B8751F;background:#FBEBD0;color:#9A5F14;border-radius:999px;padding:4px 12px 4px 8px;font-size:14px;font-weight:900;font-family:var(--font);cursor:default}
.pill.end{border-color:#4E8F6A;background:#E7F3E6;color:#3C7F5B}
.pill.ot{border-color:#D4505E;background:#FBE3E3;color:#C2404E}
@media (max-width:459px){.timeline .lvl{display:none}}
@media (max-width:389px){.timeline .cl{font-size:30px}}

/* Thẻ, nút, ô menu */
.content{padding:12px 14px 230px;gap:10px}
.card{background:var(--surface);border:2.5px solid var(--card-line);border-radius:16px;padding:10px 16px 12px;gap:3px}
.card .lab{font-size:15px;font-weight:800;color:var(--tan)}

.card.gold{border-left:2.5px solid #E2B96B;border-color:#E2B96B}

.kv{font-weight:700}.kv b{font-family:var(--font);font-weight:800}
.btn{border:2px solid var(--outline);border-radius:12px;font-weight:900;font-family:var(--font)}

.btn.bad{border-color:var(--bad)}

.mt span{font-size:15px;font-weight:900;text-align:center}
.mt .emo{font-size:25px}
.sheet{border:3px solid var(--outline);border-radius:20px}
.toast{bottom:calc(122px + env(safe-area-inset-bottom,0px));border-radius:14px;font-weight:800}
.hint{display:flex;gap:8px;align-items:flex-start;color:var(--tan);font-size:17px;font-weight:700;line-height:1.35;margin-top:4px}
.hint .emo{margin-top:2px}
.pillb{font-weight:800}

/* Thanh dưới + nút tròn giữa */
.dock{background:var(--hdr);border-top:2px solid var(--card-line);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs{grid-template-columns:1fr 1fr 104px 1fr 1fr;align-items:end}.tabs .wide{grid-column:span 2}.mt svg.rich{width:38px;height:38px;filter:drop-shadow(0 1px 0 rgba(255,255,255,.6))}.px.rich{width:36px;height:36px}.ico.rich{overflow:visible}
.tab{padding:4px 0 2px;gap:4px;font-size:14px;white-space:nowrap;font-weight:800;color:var(--tan)}
.tab.on{color:var(--ink);font-weight:900}
.tab.on::before{display:none}
.tab .px{width:30px;height:30px}
.ff{z-index:7;left:50%;right:auto;margin-left:-46px;bottom:calc(env(safe-area-inset-bottom,0px) + 4px);width:92px;height:92px;border:5px solid #6B4A3C;background:#E0707C;color:#fff;box-shadow:0 5px 14px rgba(74,47,39,.28);gap:3px}
.ff .ffl{font-size:15px;font-weight:900;line-height:1.1}

@media (min-width:521px){.ff{right:auto}}
.ff{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.mailfab{position:fixed;right:calc(max(0px,(100vw - 520px) / 2) + 2px);top:38%;z-index:4;width:42px;height:42px;padding:0;border-radius:50%;border:3px solid var(--outline);background:#FFF8EA;font-size:20px;line-height:1;box-shadow:0 3px 0 var(--outline);cursor:pointer}
.onlinepill{flex:none;padding:4px 9px;border-radius:12px;background:#EAF7EF;color:#1E7A45;font:800 13px/1.2 var(--font);white-space:nowrap}
.onlinepill i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#27AE60;margin-right:5px}
.annov{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(74,47,39,.55)}
.anncard{width:100%;max-width:400px;max-height:80vh;overflow:auto;background:#FFF8EA;border:3px solid var(--outline);border-radius:20px;padding:18px;box-shadow:0 6px 0 var(--outline);font-family:var(--font)}

.mailfab:active{transform:translateY(2px);box-shadow:0 1px 0 var(--outline)}
/* Tin nhắn */

.msgn{font-size:12px;font-weight:900;color:#2F80ED}
.msgt{font-size:11px;color:#8A93A6;font-weight:700;align-self:flex-end}
.msgsys{align-self:center;max-width:92%;text-align:center;background:#FFF3D6;color:#7A5A2B;border-radius:12px;padding:6px 12px;font-size:13px;font-weight:700;line-height:1.35}
.msgchips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 2px;flex:none}
.msgchip{flex:none;font:800 13.5px var(--font);color:#2F80ED;background:#fff;border:2px solid #BFD8FA;border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.msgbar{display:flex;gap:8px;padding:8px 12px 12px;flex:none}

    const a = Math.abs(n);
    const s = n < 0 ? '-' : '';
    if (a >= 1e15)
        return s + a.toExponential(1).replace('e+', 'e') + 'đ';
    if (a >= 1e12)
        return s + trim(a / 1e12, 0) + ' nghìn tỷ';
    if (a >= 1e9)
        return s + trim(a / 1e9, a >= 1e10 ? 0 : 2) + ' tỷ';
    if (a >= 1e6)
        return s + trim(a / 1e6, a >= 1e8 ? 0 : 1) + 'tr';
    if (a >= 1e3)
        return s + Math.round(a / 1e3) + 'k';

    { title: 'Có gì mới ở V3.5', body: 'Chi nhánh trên bản đồ Việt Nam với 13 địa điểm, mỗi nơi có tiền thuê, doanh thu và thử thách riêng. Mục Làm ăn chui trong Công ty: lời nhanh nhưng bị công an bắt thì phạt 25%, 50% tiền công ty hoặc bị khởi tố hình sự và giải thể. Bảng lương phải được sếp ký mới phát. Hệ thống người yêu: hẹn hò, gặp gia đình, ăn hỏi, đám cưới, sinh con và link mời bạn bè. Tin nhắn với mẹ, bố, anh trai, chị gái: họ hỏi thăm, rủ về ăn Tết, anh trai có khi hỏi mượn tiền. Tab Bảng lương riêng trong Nhân sự, tách khỏi Công đoàn. Tài sản mở rộng: 200 mẫu xe, 10 mức thuê chỗ ở, 12 loại nhà riêng, 20 loại nhà đất có biểu đồ giá 60 ngày và banner minh họa, sàn đầu tư 5 mã. Học và thi trước khi vào ngành. Chi tiết từng phần ở các mục bên dưới.' },
    { title: 'Làm ăn chui và giải thể', body: 'Trong Công ty có mục Làm ăn chui, chia 3 mức, mỗi vụ đều ghi căn cứ pháp luật. Người bắt là công an, áp dụng Bộ luật Hình sự 2015 (sửa đổi 2017) và các luật về thuế, hải quan, hàng cấm, hàng giả, hàng lậu. Mức nhẹ (khai khống chi phí, mua hóa đơn, lương ngoài sổ sách, hàng không nguồn gốc): bị bắt thì thường phạt 25% tiền công ty nhưng vẫn có khả năng bị khởi tố và giải thể. Mức trung bình (hàng lậu, hàng giả, hàng cấm): phạt 50% tiền công ty, trừ uy tín và điểm luật, khả năng bị khởi tố hình sự cao hơn nhiều. Mức nặng (đường dây buôn lậu lớn, buôn động vật hoang dã, rửa tiền): bị bắt là khởi tố, tịch thu hết và công ty bị đình chỉ hoạt động vĩnh viễn. Pháp nhân thương mại chịu trách nhiệm hình sự theo Điều 75, 76 và chịu hình phạt theo Điều 33 Bộ luật Hình sự, và việc đó không loại trừ trách nhiệm hình sự của cá nhân bạn. Mỗi vụ cho biết xác suất bị giải thể nếu bị bắt; hai chuyến làm chui đầu trót lọt, chuyến thứ 3 chắc chắn bị công an phát hiện; khi bị bắt, mức phạt có thể cao hoặc thấp và xác suất bị khởi tố, giải thể là 5% (mức nặng thì giải thể). Mỗi ngày làm tối đa một vụ; độ chú ý giảm 1 điểm mỗi ngày. Công ty cũng bị giải thể khi âm tiền quá nhiều, âm tiền quá số ngày cho phép, hoặc sức khỏe của bạn về 0. Đây chỉ là trò chơi mô phỏng, không phải tư vấn pháp lý.' },
    { title: 'Chi nhánh', body: 'Vào Công ty, chọn Chi nhánh để mở bản đồ Việt Nam và bấm vào địa điểm muốn mở. Có 13 nơi: Hà Nội, Sa Pa, Hạ Long, Cố đô Huế, Đà Nẵng, Hoàng Sa – Trường Sa, Buôn Ma Thuột, Đà Lạt, TP. Hồ Chí Minh, Vũng Tàu, Cần Thơ, Phú Quốc và Cà Mau. Mỗi nơi đòi quy mô công ty tối thiểu (cấp 1 đến 4 trong 5 cấp), phí mở trả bằng tiền mặt công ty, tiền thuê mặt bằng trừ vào ngày 5 và đem lại doanh thu mỗi ngày, doanh thu cao hơn khi uy tín công ty cao. Khai trương được cộng uy tín và tinh thần; mỗi nơi có đặc điểm và thử thách riêng ghi trong thẻ. Đóng chi nhánh thì thu hồi 30% phí mở.' },
    { title: 'Người yêu và gia đình', body: 'Vào Hoạt động, chọn Người yêu (lần đầu sẽ hỏi bạn là nam hay nữ). Bấm Tìm người yêu rồi chọn một người. Mỗi lần Đi hẹn hò tốn 500 nghìn, đủ 15 điểm tình cảm thì hẹn gặp gia đình sau 7 ngày: bố mẹ hỏi 5 câu, đúng ít nhất 3 câu là được duyệt. Sau đó ra cửa hàng sắm nhẫn cưới, hoa cưới, mâm quả và áo dài hoặc vest. Một tuần sau là lễ ăn hỏi (cán bộ công nhân viên đến mừng, bạn nhận tiền mừng), thêm một tuần nữa là đám cưới (tiệc 60 triệu, nhân viên mừng cưới). Sau cưới hai vợ chồng cùng đi làm bình thường, chưa có con thì không tốn thêm. Sinh con tốn viện phí 25 triệu (tối đa 3 con) và bạn chọn: ở riêng thì chồng lo chi phí ăn uống 30 triệu mỗi tháng, hoặc về nhà gái đẻ thì nhà trai chi trả 50 triệu mỗi tháng. Nếu bạn là nữ thì chồng/nhà trai lo, bạn không mất tiền. Chia tay hoặc ly hôn ra tòa vẫn phải cấp dưỡng con 3 triệu mỗi con mỗi tháng. Bấm Tạo link mời để gửi cho bạn bè, người nhận dán link vào hoặc bấm Nhận lời để thành người yêu của bạn.' },
    { title: 'Tin nhắn gia đình', body: 'Ngoài nhóm công ty, trong Tin nhắn có Mẹ, Bố, Anh trai và Chị gái. Họ chủ động nhắn theo hoàn cảnh: mẹ hỏi ăn cơm chưa, hỏi Tết có về không, và lo lắng khi sức khỏe của bạn xuống dưới 50. Bố nhắc khi bạn đang vay ngân hàng hoặc tiền công ty sắp thiếu. Chị rủ về ăn cơm cuối tuần. Anh trai thỉnh thoảng hỏi mượn tiền: bạn chọn cho mượn hay không, anh thường trả đúng hẹn nhưng đôi khi xin khất. Đầu năm mới cả nhà gửi lời chúc. Bạn trả lời bằng nút gợi ý hoặc tự gõ.' },

    { title: 'Mục tiêu', body: 'Bạn là chủ một công ty nhỏ. Giữ công ty sống sót, tuân thủ pháp luật và thăng dần 200 cấp chức vụ để thành Chủ tịch Hội đồng cấp cao.' },
    { title: 'Thời gian chạy liên tục', body: 'Đồng hồ chạy khi bạn bấm Tiếp tục. Chọn tốc độ 1x, 2x hoặc 4x. Có sự kiện hoặc báo cáo quan trọng thì game tự tạm dừng. Mỗi hành động của sếp tốn giờ thật trong ngày.' },
    { title: 'Giờ làm việc', body: 'Nhân viên Chuyên môn chỉ làm T2 đến T6, 08:00 đến 12:00 và 13:00 đến 17:00. Cuối tuần và ban đêm công ty không tiến độ. Bật Tăng ca để làm thêm buổi tối và sáng thứ bảy, đổi lại tinh thần tụt và tốn thêm tiền.' },
    { title: 'Dự án và hạn', body: 'Nhận dự án trong tab Dự án. Mỗi dự án có hạn từ 10 đến 18 ngày lịch. Nhân viên Chuyên môn và Kinh doanh có thể tự nhận dự án, nhưng mỗi dự án tự nhận cần ít nhất 2 công nhân để làm (thuê trong mục Tuyển dụng). Làm không kịp thì mất tiền phạt, uy tín và tinh thần. Xem mục Dự kiến để biết dự án nào sắp trễ.' },
    { title: 'Nhân sự', body: 'Chuyên môn làm dự án, Kinh doanh kéo thêm dự án, Tiếp thị tăng uy tín, Kế toán giảm chi phí và thuế. Lương trả vào ngày 5 hằng tháng. Nhân viên chán nản sẽ nghỉ việc.' },
    { title: 'Chức danh và đề bạt', body: 'Mỗi nhân viên có một bậc chức danh. Nhánh Văn phòng: Thực tập sinh, Nhân viên, Chuyên viên, Trưởng nhóm, Phó phòng, Trưởng phòng, Giám đốc. Nhánh Công nhân: Lao động thời vụ, Công nhân, Nhân viên, Chuyên viên, Tổ trưởng, Phó phòng sản xuất, Trưởng phòng sản xuất, Giám đốc nhà máy, Phó tổng giám đốc. Muốn lên bậc cần đủ Năng lực (kỹ năng × 10), đủ ngày ở bậc hiện tại (15 ngày cho bậc 1, 30 ngày cho bậc 2, tiếp tục tăng thêm 15) và công ty đã mở bậc đó khi nâng cấp. Một Trưởng phòng quản tối đa 15 người: nhóm nào đủ 15 người thì Cán bộ nhân sự đề xuất trưởng phòng mới và bạn mới đề bạt được. Lao động thời vụ không đóng bảo hiểm. Các bậc từ Nhân viên trở lên ăn lương theo năng lực. Giám đốc ăn lương thỏa thuận lúc bổ nhiệm, chỉ tăng mỗi năm một lần (năng lực từ 70 tăng 10%, từ 40 tăng 5%, dưới 40 không tăng và Gắn bó giảm). Giữa kỳ muốn giữ Giám đốc thì dùng Thưởng nóng.' },
    { title: 'Công nhân và Công đoàn', body: 'Công nhân ăn lương theo mức lương tối thiểu vùng 1 (5,31 triệu, tăng nhẹ theo tay nghề), cộng phụ cấp xăng xe cố định hằng tháng và thưởng theo năng suất (tính theo số điểm việc thực làm trong tháng). Khi trả lương ngày 5, công nhân bị trừ bảo hiểm (10,5% lương cơ bản), công đoàn phí (1% lương cơ bản) và thuế thu nhập cá nhân; công ty trả thêm kinh phí công đoàn 2% tổng lương. Tiền này vào quỹ Công đoàn. Công đoàn dùng quỹ để hỗ trợ nhân viên: tự động giúp người đang chán nản, tránh để họ nghỉ việc, và bạn có thể chủ động chi quà tặng hoặc hỗ trợ người khó khăn.' },
    { title: 'Tài chính', body: 'Ngày 5 hằng tháng công ty trả lương, tiền thuê, vận hành và thuế. Vay ngân hàng có lãi theo ngày. Các sàn đầu tư (tiền ảo, vàng, USD) biến động ngẫu nhiên, có thể lỗ.' },
    { title: 'Tài sản', body: 'Tab Tài sản là một lưới các mục: Tổng quan, Ví cá nhân, Cửa hàng (tài sản công ty), Đổi chỗ ở, Xe, Ngân hàng, Đầu tư nhà đất, Đầu tư (sàn tiền ảo, vàng, USD). Ngày 5, sau khi công ty trả lương nhân viên, thuê, vận hành và thuế, bạn tự nhận một tỷ lệ lợi nhuận sau thuế (không có lãi thì không có lương) vào ví cá nhân, rồi trừ chi tiêu hàng tháng (sinh hoạt, tiền thuê nhà, xe, chi phí gia đình). Không đủ tiền thì túng thiếu, tinh thần và sức khỏe tụt. Đổi chỗ ở: 10 mức thuê từ phòng trọ đến biệt thự, hoặc mua 12 loại nhà riêng. Chỗ ở càng tốt thì nghỉ ngơi càng tốt, có nhà riêng thì khỏi tiền thuê. Xe: 200 mẫu xe máy và ô tô, đổi xe thì được trừ 80% giá trị xe cũ, bán lại thu 80% giá trị. Ngân hàng: vay có lãi theo ngày, gửi tiết kiệm lãi 0,5% mỗi tháng. Sàn đầu tư có 5 mã (MèoCoin, PhởCoin, TràSữaToken, Vàng SJC, USD), phí mỗi lần mua bán 0,5%. Tài sản ròng = tiền công ty + ví cá nhân + tiết kiệm + quỹ + nhà đất + xe + nhà + tài sản - nợ.' },
    { title: 'Nhà đất', body: 'Mục Đầu tư nhà đất có 20 loại bất động sản chia 4 nhóm: Đất đai (đất ruộng, đất nền, đất thổ cư, đất khu công nghiệp), Nhà ở (phòng trọ, nhà cho thuê, căn hộ, nhà phố, biệt thự, penthouse), Kinh doanh (ki-ốt, mặt bằng, kho xưởng, shophouse, văn phòng) và Cao cấp (khách sạn mini, villa ven biển, tòa nhà thương mại, resort, khu đô thị). Giá chạy theo chỉ số thị trường, xem biểu đồ 60 ngày ở đầu mục: giá lên thì lãi, giá xuống thì lỗ. Mua và bán mất phí 2%, tiền mua lấy từ ví cá nhân. Loại có cho thuê thì tiền thuê vào ví cá nhân vào ngày 5; đất thì không có tiền thuê, chỉ hy vọng giá lên. Được giữ tối đa 20 bất động sản.' },

    { title: 'Quyết định', body: 'Khoảng 20 đến 30 ngày có một việc lớn cần bạn quyết. Ba hướng: táo bạo, cân bằng, thận trọng. Hệ quả rõ sau 1 đến 2 tuần. Quá 3 ngày không quyết thì tự chọn thận trọng và mất uy tín.' },
    { title: 'Chức vụ và 200 cấp', body: 'Bạn là chủ và leo từ Chủ hộ mới mở lên Chủ tịch Hội đồng cấp cao: 20 chức danh, mỗi chức danh 5 bậc, tổng 200 cấp. Mỗi lần thăng cấp cần đủ uy tín, tiền và hoàn thành các nhiệm vụ của cấp đó. Cứ 20 cấp, công ty lớn thêm một bậc (Hộ kinh doanh, Khởi nghiệp, Công ty nhỏ, Công ty vừa, Tập đoàn).' },
    { title: 'Đăng ký kinh doanh', body: 'Khi mới vào game, bạn phải đăng ký kinh doanh (mở ở Công ty, Giấy phép) trước hạn ngày 4. Lệ phí nhỏ và mất 2 giờ. Không đăng ký thì bị phạt tiền lặp lại mỗi tuần, mất uy tín, tụt điểm luật và không thể thăng chức. Khoảng 320 sự kiện hằng ngày và 120 thành tựu đang chờ bạn.' },
    { title: 'Pháp luật', body: 'Mỗi luật có một điểm tuân thủ, tự tụt dần theo ngày. Thanh tra bất ngờ sẽ kiểm tra: dưới ngưỡng thì bị phạt tiền và mất uy tín. Cấp càng cao càng có thêm luật: Doanh nghiệp, An toàn lao động và PCCC, Lao động, Kế toán và Kiểm toán, Cạnh tranh và Chứng khoán, và từ cấp 76 là Quản lý vốn nhà nước. Tuyển Cán bộ an toàn và Cán bộ pháp chế để điểm tụt chậm hơn. Đây là bản mô phỏng đơn giản hóa, không phải tư vấn pháp lý.' },
    { title: 'Hội đồng cấp cao', body: 'Từ cấp 70 có Hội đồng 5 ủy viên, mỗi người quan tâm một mặt (tài chính, pháp chế, nhân sự, chiến lược, kiểm soát). Muốn thăng cấp phải có ít nhất 3 phiếu ủng hộ. Bạn có thể đi vận động từng người, nhưng điểm ủng hộ tự trôi theo kết quả công ty.' },
    { title: 'Phòng pháp chế và vụ việc', body: 'Tuyển Cán bộ pháp chế để lập phòng pháp chế. Khi phát hiện nhân viên nhận hối lộ, lạm quyền hoặc tham ô, phòng sẽ báo cáo cho bạn (người sáng lập). Bạn chọn: giao nộp công an và chuyển tòa án (án phí, tòa xử sau 1 đến 2 tuần, có thể bồi thường, tù hoặc đình chỉ nếu thiếu chứng cứ), xử lý nội bộ (nhanh nhưng che giấu thì thanh tra phạt nặng), hoặc làm ngơ. Không có phòng pháp chế thì tiền thất thoát mà không rõ ai làm.' },
    { title: 'Doanh nghiệp nhà nước', body: 'Từ cấp 76 công ty là doanh nghiệp nhà nước: hạn mức vay bị cắt một nửa, không được đầu tư ngoài ngành, phải bảo toàn vốn và chịu kiểm toán nhà nước gắt hơn.' },
    { title: 'Tua nhanh', body: 'Giữ nút tròn giữa để thời gian chạy vèo, thả tay ra là về tốc độ cũ. Nút Sáng mai tua thẳng tới 06:00 hôm sau rồi dừng. Tốc độ 8x cho đoạn chờ lương.' },

    { title: 'Có gì mới ở V3.0', body: 'Ngày lễ và Tết nghỉ theo quy định, công đoàn có quà, thưởng Tết do sếp quyết định. Nhắn tin trả lời như thật: mỗi người một giọng, biết hỏi thăm, biết tâm sự và nhắc việc. Nhân viên xin nghỉ phải báo trước 1 tháng, bỏ việc đột ngột thì bị truy cứu trách nhiệm và phải bồi thường. Tinh thần tụt chậm hơn, chi phí sống tăng theo lương.' },
    { title: 'Ngày lễ và Tết', body: 'Game nghỉ đúng 11 ngày lễ trong năm: Tết Dương lịch, Tết Nguyên đán (5 ngày), Giỗ Tổ Hùng Vương, 30/4 và 1/5, Quốc khánh (2 ngày). Ngày lễ rơi vào T7, CN thì nghỉ bù vào ngày làm việc kế tiếp. Nghỉ lễ công ty không làm việc, kể cả tăng ca, vẫn trả đủ lương và hạn dự án được lùi theo số ngày nghỉ. Đầu mỗi kỳ nghỉ, Công đoàn tặng quà cho nhân viên từ quỹ Công đoàn (quỹ trống thì không có quà, nhân viên sẽ buồn). Trước Tết khoảng 12 ngày, sếp chọn mức thưởng Tết: đầy đủ (tháng 13 theo thâm niên), nửa tháng, lì xì tượng trưng hoặc không thưởng.' },

    { title: 'Cài game ra màn hình điện thoại', body: 'iPhone: mở game bằng Safari, bấm nút Chia sẻ (hình ô vuông có mũi tên lên), kéo xuống chọn Thêm vào Màn hình chính, rồi bấm Thêm. Android: mở game bằng Chrome, bấm menu ba chấm ở góc phải, chọn Cài đặt ứng dụng hoặc Thêm vào màn hình chính. Sau đó mở game từ biểu tượng ngoài màn hình, chạy toàn màn hình như app. Tiến trình lưu ngay trên máy bạn, nên hãy luôn mở lại bằng đúng biểu tượng đó, đừng xóa dữ liệu trình duyệt.' },

const richSvg = (name, size, cls) => `<svg class="${cls} rich" width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true">${RICH[name]}</svg>`;
const ic = (name, size = 20) => RICH[name] ? richSvg(name, size, 'ico') : EMO[name] ? `<span class="ico emo" style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.82)}px" aria-hidden="true">${EMO[name]}</span>` : icSvg(name, size);

function trendArt() {
  const W = 120, H = 60, pts = [8, 14, 12, 22, 20, 30, 27, 26, 36, 44, 40, 52];
  let o = '';
  for (let y = 10; y < H; y += 10) o += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="currentColor" stroke-opacity=".12" stroke-width=".4"/>`;
  const xs = pts.length / 2, line = [];
  for (let i = 0; i < pts.length; i += 2) line.push([6 + (i / 2) * (W - 12) / (xs - 1), H - pts[i + 1] - 4]);
  for (let i = 0; i < line.length; i++) { const bh = 8 + i * 4.2 + (i % 2) * 4, x = 6 + i * (W - 12) / (xs - 1) - 3.2; o += `<rect x="${x}" y="${H - bh}" width="6.4" height="${bh}" rx="0.8" fill="currentColor" fill-opacity=".10"/>`; }
  o += `<polyline points="${line.map((p) => p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/>`;
  const last = line[line.length - 1];
  o += `<circle cx="${last[0]}" cy="${last[1]}" r="1.8" fill="var(--accent)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ tăng trưởng" style="color:var(--coral)">${o}</svg>`;
}

const PC_IMG_TXT = '📷 Ảnh';
const PC_IMG_RE = /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/;
const pcImgOk = (v) => typeof v === 'string' && v.length < 400000 && PC_IMG_RE.test(v);
const pcImgHtml = (v) => pcImgOk(v) ? `<img class="msgimg" src="${v}" alt="Ảnh" data-a="pcZoom" loading="lazy">` : '';
function pcShrink(file) {
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      try {
        const MAX = 720, k = Math.min(1, MAX / Math.max(im.width, im.height));
        const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(im.width * k)); cv.height = Math.max(1, Math.round(im.height * k));
        const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(im, 0, 0, cv.width, cv.height);
        let q = 0.7, out = cv.toDataURL('image/jpeg', q);
        while (out.length > 110000 && q > 0.3) { q -= 0.1; out = cv.toDataURL('image/jpeg', q); }
        URL.revokeObjectURL(url); out.length < 400000 ? ok(out) : no(new Error('big'));
      } catch (e) { URL.revokeObjectURL(url); no(e); }
    };
    im.onerror = () => { URL.revokeObjectURL(url); no(new Error('bad')); };
    im.src = url;
  });
}

  let img; try { img = await pcShrink(file); } catch (e) { toast('Không đọc được ảnh này'); return; }
  const cap = (pcDraft || '').trim().slice(0, 300); pcDraft = ''; pc.last = Date.now();

}

let msgTm = null;
function msgSched() {
  clearTimeout(msgTm);
  if (!msgOpen || !msgThread || !G) return;
  const now = Date.now(), arr = ((G.chat && G.chat.msgs) || {})[msgThread] || [];
  const next = arr.filter((m) => m.show && m.show > now).map((m) => m.show).sort((a, b) => a - b)[0];
  if (!next) return;
  msgTm = setTimeout(() => {
    const b = document.querySelector('.msgbody.thread');
    if (!b || !msgOpen) return;
    b.innerHTML = msgBubblesHtml(); b.scrollTop = b.scrollHeight;
    if (G.chat) G.chat.unread = 0;
    save(); msgSched();
  }, next - now + 20);
}
function msgAfterRender() {
  if (!msgOpen) return;
  msgSched();
  const b = document.querySelector('.msgbody.thread'); if (b) b.scrollTop = b.scrollHeight;
  const i = document.getElementById('msg-in'); if (i && msgFocus) { i.focus(); msgFocus = false; }
  const pi = document.getElementById('pc-in'); if (pi && pcFocus) { pi.focus(); pcFocus = false; }
  const fw = document.querySelector('.fdwrap'); if (fw) fw.scrollTop = fdScroll;
  if (fdFocus) { const fe = document.getElementById(fdFocus); if (fe) fe.focus(); fdFocus = ''; }
}

function sysBarHtml() {
  if (!G || !G.sys || G.over) return '';
  const S = M_sys, s = G.sys;
  const qs = (s.q || []).map((q) => ({ q, p: S.progress(G, q) }));
  qs.sort((a, b) => (b.p.ok - a.p.ok) || ((b.p.cur / (b.q.need || 1)) - (a.p.cur / (a.q.need || 1))));
  const top = qs[0], ready = qs.some((x) => x.p.ok);

const VM_LBL = { bmt: 'l', hcm: 'l', cantho: 'l', dalat: 'r', hoangsa: 'n' };
function branchMapSvg() {
  const lbl = (b) => { const m = VM_LBL[b.id]; if (m === 'n') return ''; const nm = esc(b.name); return m === 'l' ? `<text x="${b.x - 20}" y="${b.y + 4}" text-anchor="end" class="bl">${nm}</text>` : m === 'r' ? `<text x="${b.x + 20}" y="${b.y + 4}" text-anchor="start" class="bl">${nm}</text>` : `<text x="${b.x}" y="${b.y + 35}" text-anchor="middle" class="bl">${nm}</text>`; };
  const own = G.branches || {};
  const pins = E.BRANCHES.map((b) => {
    const has = !!own[b.id], sel = branchSel === b.id, lock = G.level < b.lvl;
    return `<g class="bp ${has ? 'own' : ''} ${sel ? 'sel' : ''} ${lock ? 'lock' : ''}" data-a="branchPick" data-id="${b.id}" tabindex="0" role="button" aria-label="${esc(b.name)}">
      <path class="bt" d="M${b.x - 6} ${b.y + 12} L${b.x} ${b.y + 22} L${b.x + 6} ${b.y + 12} Z"/><circle cx="${b.x}" cy="${b.y}" r="15" class="bc"/><text x="${b.x}" y="${b.y + 5}" text-anchor="middle" font-size="15">${b.ic}</text>
      ${has ? `<circle cx="${b.x + 12}" cy="${b.y - 12}" r="6.5" fill="#2DB58C" stroke="#fff" stroke-width="1.5"/><text x="${b.x + 12}" y="${b.y - 9}" text-anchor="middle" font-size="8" fill="#fff" font-weight="900">✓</text>` : ''}
      ${lbl(b)}</g>`;
  }).join('');
  return `<svg class="vmap" viewBox="0 0 400 575" role="img" aria-label="Bản đồ Việt Nam để chọn nơi mở chi nhánh">${VN_MAP_BG}${pins}</svg>`;
}
function shadyHtml() {
  const done = G.shadyDay === G.day;
  const tiers = [[1, 'Mức nhẹ', 'công an bắt thì phạt cao hoặc thấp quanh 25% tiền công ty, 5% bị khởi tố và giải thể'], [2, 'Mức trung bình', 'công an bắt thì phạt cao hoặc thấp quanh 50% tiền công ty, 5% bị khởi tố và giải thể'], [3, 'Mức nặng', 'công an bắt là khởi tố, mất hết, công ty giải thể']];
  const lim = E.debtLimit(G);
  const head = `<div class="card gold"><span class="lab">${ic('shady', 18)}Độ chú ý của cơ quan chức năng</span><span class="val">${Math.round(G.heat || 0)}/100</span>

    ${kv('Số lần bị công an xử lý', String(G.shadyCaught || 0))}${kv('Số chuyến kể từ lần bị bắt trước', (G.shadyRuns || 0) + '/3')}${kv('Tiền công ty', money(G.cash))}${kv('Mức nợ bị giải thể', '-' + money(-lim))}</div>`;
  const card = (d) => {
    const risk = E.shadyRisk(G, d), ask = confirmState && confirmState.t === 'shady' && confirmState.id === d.id;

function mkChart(h, fmt = vnd) {
  const n0 = h.length; if (h.length < 2) h = [h[0], h[0]];
  const W = 340, H = 130, lo = Math.min(...h), hi = Math.max(...h), pad = 4, sp = Math.max(1e-9, hi - lo);
  const pts = h.map((p, i) => [pad + (i / (h.length - 1)) * (W - pad * 2), H - 18 - ((p - lo) / sp) * (H - 40)]);
  const line = pts.map((q) => q.map((n) => n.toFixed(1)).join(',')).join(' ');
  const up = h[h.length - 1] >= h[0], col = up ? '#2E9B5E' : '#D0412F';

  const last = pts[pts.length - 1];
  return `<div style="border:3px solid var(--outline,#5C3D31);border-radius:14px;background:#FFFAF0;padding:4px 4px 2px;position:relative"><svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">${grid}
    <polygon points="${pad},${H - 18} ${line} ${W - pad},${H - 18}" fill="${col}" opacity=".13"/><polyline points="${line}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.5" fill="${col}"/>

function projectsHtml() {
  const sub = subs.projects, slots = E.maxSlots(G);
  const head = pills([['active', `Đang làm (${G.active.length}/${slots})`], ['wait', `Chờ nhận (${G.offers.length})`]], sub);
  if (sub === 'wait') {
    return head + (G.offers.length ? G.offers.map((p) => pjCard(p, `<div class="pj-chips"><span class="pj-chip">⚒️ Khối lượng ${p.work}</span><span class="pj-chip">⏳ Hạn ${p.days} ngày</span><span class="pj-chip good">⭐ Uy tín +${p.rep}</span></div>
      <span class="mini">Đề nghị còn ${Math.max(0, p.expire - G.day)} ngày</span>
      <div class="row" style="margin-top:2px">${btn('Nhận', 'take', { sm: true, id: p.id, flex: true, off: G.active.length >= slots })}${btn('Từ chối', 'decline', { kind: 'ghost', sm: true, flex: true, id: p.id })}</div>`)).join('')
      : '<span class="sub">Chưa có đề nghị mới. Chạy quảng cáo, gặp đối tác hoặc thuê nhân viên Kinh doanh sẽ có thêm.</span>');
  }
  const eta = E.etaDays(G);
  return head + `<span class="sub">Nhân viên Chuyên môn đẩy khoảng ${Math.round(E.staffPower(G) * 10) / 10} điểm việc mỗi ngày làm việc (T2 đến T6). Công nhân (${E.workers(G).length} người) đẩy khoảng ${Math.round(E.workerPower(G) * 10) / 10} điểm, làm các dự án nhân viên tự nhận (cần ${E.WORKERS_PER_PROJECT} công nhân mỗi dự án). Bạn tự làm được +${E.bossPower(G)} điểm mỗi 2 giờ.</span>`
    + (G.active.length ? `<span class="sub">Nhân lực được dồn cho dự án có hạn gần nhất trước. Dự án xếp sau sẽ đứng 0% cho tới khi dự án trước xong, đó là bình thường, không phải bị treo. Nhận ít dự án lại, hoặc tuyển thêm nhân viên, sẽ nhanh hơn. Game chỉ tính tiến độ trong giờ làm T2 đến T6.</span>` + G.active.map((p) => {
      const left = p.deadline - G.day, late = eta[p.id] > left;
      const grp = [...G.active].filter((x) => !!x.auto === !!p.auto).sort((x, y) => x.deadline - y.deadline), qi = grp.findIndex((x) => x.id === p.id);
      const noPow = (p.auto ? E.workerPower(G) : E.staffPower(G) + E.workerPower(G)) <= 0;
      const qchip = noPow ? `<span class="pj-chip warn">⚠️ Chưa có ${p.auto ? 'công nhân' : 'nhân viên'} để làm, hãy tuyển người hoặc tự làm</span>` : qi === 0 ? '<span class="pj-chip good">🔨 Đang làm</span>' : `<span class="pj-chip">🕑 Chờ tới lượt (xếp sau ${qi} dự án gấp hơn)</span>`;
      return pjCard(p, `${coopChip(p)}${p.auto ? `<div class="pj-chips"><span class="pj-chip good">👷 ${esc(p.by)} tự nhận, công nhân làm</span></div>` : ''}
      <span class="lab" style="color:var(--muted)">Tiến độ <span data-progtxt="${p.id}">${Math.round(p.done)}/${p.work}</span></span>${bar(p.done, p.work, late ? 'bad' : '', `data-prog="${p.id}" data-work="${p.work}"`)}
      <div class="pj-chips">${qchip}<span class="pj-chip ${left >= 0 ? '' : 'warn'}">${left >= 0 ? `⏳ Hạn còn ${left} ngày` : '⚠️ Quá hạn'}</span><span class="pj-chip ${late ? 'warn' : 'good'}">Dự kiến xong ~${eta[p.id]} ngày${late ? ', sẽ trễ' : ''}</span></div>
      <div style="margin-top:2px">${btn(`Tự làm 2 giờ (+${E.bossPower(G)}, -3 sức khỏe)`, 'selfwork', { kind: 'warm', sm: true, id: p.id })}</div>`);

/* ---------- Tài chính ---------- */
function financeHtml() {
  const sub = subs.finance;
  const head = pills([['ov', 'Tổng quan'], ['rep', 'Báo cáo']], sub, 'finance');
  const tax = E.monthlyCosts(G).tax;
  const burn = E.monthlySalaries(G) + E.monthlyOverhead(G);
  if (sub === 'rep') {
    const m = G.monthly;
    if (!m.length) return head + '<span class="sub">Chưa có báo cáo. Báo cáo đầu tiên được lập vào ngày 5.</span>';
    const mx = Math.max(1, ...m.map((x) => Math.max(x.inc, x.out)));
    const last = m[m.length - 1], lp = G.lastPay;
    return head + `<div class="card"><span class="lab">Thu và chi theo tháng</span>
      <div class="chart">${m.map((x) => `<div class="g"><i class="in" style="height:${Math.max(2, (x.inc / mx) * 100)}%" title="Thu ${money(x.inc)}"></i><i class="out" style="height:${Math.max(2, (x.out / mx) * 100)}%" title="Chi ${money(x.out)}"></i></div>`).join('')}</div>
      <div class="xl">${m.map((x) => `<span>${x.label}</span>`).join('')}</div>
      <div class="legend"><span><i class="dot" style="background:var(--green)"></i>Thu</span><span><i class="dot" style="background:var(--bad)"></i>Chi</span><span>Cột cao nhất = ${money(mx)}</span></div></div>
      <div class="card"><span class="lab">Kỳ ${last.label}</span>${kv('Thu', money(last.inc))}${kv('Chi', money(last.out))}${kv(last.inc - last.out >= 0 ? 'Lãi' : 'Lỗ', `<span class="${last.inc - last.out >= 0 ? 'ok' : 'no'}">${money(Math.abs(last.inc - last.out))}</span>`)}
      ${lp ? kv('· Lương', money(lp.salaries)) + kv('· Thuê văn phòng', money(lp.rent)) + kv('· Vận hành', money(lp.util)) + kv('· Thuế', money(lp.tax)) + kv('· Công đoàn', money(lp.union ?? 0)) : ''}</div>`;
  }
  const lp = G.lastPay;
  return head + `<div class="card">${kv('Tiền mặt', `<span class="${G.cash < 0 ? 'no' : ''}">${money(G.cash)}</span>`)}${kv('Thu tháng này', money(G.stats.monthIncome))}
      ${kv('Chi dự kiến ngày 5', '≈' + money(burn + tax))}${kv('· Lương', money(E.monthlySalaries(G)))}${kv('· Thuê, vận hành, công đoàn', money(E.monthlyOverhead(G)))}${kv('· Thuế tạm tính', money(tax))}
      ${kv('Nợ', money(G.loan))}${kv('Sàn đầu tư', money(Math.round(E.mkValue(G))))}</div>
    ${lp ? `<span class="sub">Kỳ trước: lương ${money(lp.salaries)}, thuê ${money(lp.rent)}, vận hành ${money(lp.util)}, thuế ${money(lp.tax)}.</span>` : ''}
    <span class="sub">Kế toán giỏi giúp giảm thuê, vận hành và thuế. Tiền mặt đủ cho ${burn > 0 ? (G.cash / burn).toFixed(1) : '∞'} tháng chi phí.</span>`;
}

  const need = pc.last ? 'Đã ở bậc cao nhất.' : pc.ok ? `Đủ điều kiện lên ${esc(pc.next.t)}.` : `Cần: ${pc.why.map(esc).join(' · ')}.`;
  const nextRaise = dir && e.since !== undefined ? Math.max(0, 365 - ((G.day - e.since) % 365)) : null;

  if (/cháy|pccc|chập điện|thoát hiểm|bình chữa/.test(s)) return 'fire';

  if (/ốm|sức khỏe|đau|khám|cúm|dịch|thuốc|mất ngủ|kiệt sức/.test(s)) return 'health';
  if (/bão|ngập|mất điện|nắng nóng|cúp nước|ô nhiễm|gió lớn|mưa/.test(s)) return 'weather';
  if (/ngân hàng|vay|tài khoản|cổ phiếu|đầu tư|nhà đầu tư|bảo hiểm|tỷ giá|chuyển khoản|thanh toán|\bnợ\b|tiền|chi phí|giá thuê/.test(s)) return 'bank';

  if (/báo chí|phỏng vấn|truyền hình|podcast|quảng cáo|tin đồn|mạng xã hội|diễn đàn/.test(s)) return 'news';

// Người thứ n (n từ 1 đến 10) trúng với xác suất 1/(11-n) nếu chưa ai trúng, nên ai cũng có cơ hội ngang nhau.
async function drawSystem() {
  const tok = ++drawTok;
  try {
    const c = window.claude;
    if (!c || !c.use) return;
    const db = await c.use('db'), user = await c.use('user');
    if (!db || !user || !user.id) return;
    const id = await user.id();
    if (!id) return;
    const mine = db.collection('data/users/' + id).doc('lottery');
    let win;
    const me = await mine.get();
    if (me.exists) win = !!(me.data() || {}).win;
    else {
      const slot = db.doc('lottery/state');
      for (let i = 0; i < 40 && win === undefined; i++) {
        const r = await slot.acquire({ holder: id, ttlMs: 1000 });
        if (!r.acquired) { await new Promise((res) => setTimeout(res, 250 + Math.random() * 500)); continue; }
        const st = await slot.get();
        const d = (st.exists && st.data()) || {};
        const joined = d.joined || 0, winner = d.winner || null;
        if (joined >= 10) win = false;
        else {
          const n = joined + 1;
          win = !winner && Math.random() < 1 / (11 - n);
          await slot.set({ joined: n, winner: win ? id : winner });
          if (win) { const chk = await slot.get(); if (!chk.exists || (chk.data() || {}).winner !== id) win = false; }
        }
      }
      if (win !== undefined) await mine.set({ win });
    }
    if (win && tok === drawTok && G) run((x) => { M_sys.grant(x); return null; });
  } catch (e) {}
}

  pressKind = el.classList.contains('ff') ? 'ff' : 'go';
  pressing = true; longPress = false; clearTimeout(holdTimer);
  holdTimer = setTimeout(() => {
    if (!pressing || blocked()) return;
    longPress = true; holdFrom = running; hold = true; running = true; setTimer(); softUpdate();
  }, pressKind === 'ff' ? 150 : 350);
});
function endPress(ev) {
  if (!pressing) return;
  pressing = false; clearTimeout(holdTimer);
  if (longPress) {
    longPress = false;
    if (hold) { hold = false; if (holdFrom && running) setTimer(); else stopRun(); render(); }
    return;
  }
  if (pressKind === 'ff') return; // nút tròn: chạm không làm gì, chỉ giữ mới tua nhanh
  if (ev.type === 'pointerup') { if (running) { userPaused = true; stopRun(); } else { userPaused = false; startRun(); } }
}

/* ---------- MÃ LƯU 15 SỐ: tự lưu vào mã mỗi 15 phút ---------- */
const CODE_KEY = 'lamsep_code', SLOT_PREFIX = 'lamsep_slot_', AUTOSAVE_MS = 15 * 60 * 1000;
let saveCode = null, codeAt = 0, sCode = '';
try { const c = JSON.parse(localStorage.getItem(CODE_KEY) || 'null'); if (c && /^\d{15}$/.test(String(c.code))) { saveCode = String(c.code); codeAt = c.at || 0; } } catch (e) {}
const fmtCode = (c) => c.replace(/(\d{5})(?=\d)/g, '$1 ');
function newCode() {
  const a = new Uint32Array(15);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a); else for (let i = 0; i < 15; i++) a[i] = Math.floor(Math.random() * 4e9);
  return Array.from(a, (x, i) => (i === 0 ? 1 + (x % 9) : x % 10)).join('');
}
function writeSlot() {
  if (!G || !saveCode) return false;
  try {
    localStorage.setItem(SLOT_PREFIX + saveCode, JSON.stringify(G));
    codeAt = Date.now();
    localStorage.setItem(CODE_KEY, JSON.stringify({ code: saveCode, at: codeAt }));
    return true;
  } catch (e) { return false; }
}
setInterval(() => { if (G && saveCode) writeSlot(); }, AUTOSAVE_MS);
function copyText(t, ok) {
  const fb = () => { try { const x = document.createElement('textarea'); x.value = t; x.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(x); x.select(); document.execCommand('copy'); x.remove(); toast(ok); } catch (e) { toast(t); } };
  try { navigator.clipboard.writeText(t).then(() => toast(ok), fb); } catch (e) { fb(); }
}
function codeCard() {
  const last = codeAt ? new Date(codeAt).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) : '';
  const top = saveCode
    ? `<div class="row between"><span class="val">💾 Mã lưu game</span>${btn('Chép mã', 'codeCopy', { sm: true, kind: 'ghost' })}</div>
       <div class="val" style="font-size:24px;letter-spacing:.06em;text-align:center;padding:8px 0;background:var(--bg);border:2px solid var(--card-line);border-radius:12px">${fmtCode(saveCode)}</div>
       <span class="sub">Game tự lưu vào mã này mỗi 15 phút${last ? `, lần cuối lúc ${last}` : ''}.</span>
       ${btn('Lưu ngay', 'codeSaveNow', { sm: true })}`
    : `<span class="val">💾 Mã lưu game</span><span class="sub">Tạo mã 15 số. Game sẽ tự lưu vào mã này mỗi 15 phút.</span>${btn('Tạo mã 15 số', 'codeNew')}`;
  const ask = confirmState && confirmState.t === 'restore';
  const restore = `<label class="lab" for="s-code" style="margin-top:8px">Khôi phục từ mã</label><input type="text" id="s-code" inputmode="numeric" maxlength="19" placeholder="Nhập đủ 15 số" value="${esc(sCode)}">`
    + (ask ? `<div class="card warn"><span>Khôi phục sẽ ghi đè game hiện tại. Tiếp tục?</span><div class="row">${btn('Khôi phục', 'codeRestore', { kind: 'bad', sm: true })}${btn('Hủy', 'cancel', { kind: 'ghost', sm: true })}</div></div>` : btn('Khôi phục', 'codeAskRestore', { kind: 'ghost' }));
  return `<div class="card">${top}${restore}<span class="sub">Mã chỉ dùng được trên chính trình duyệt này của máy bạn.</span></div>`;
}

/* ---------- NHẠC NỀN: lo-fi ấm áp, tự tạo bằng Web Audio, không cần file nhạc ---------- */
const BGM = (() => {
  const KEY = 'lamsep_bgm';
  const pref = { on: true, vol: 0.6 };
  try { Object.assign(pref, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  pref.on = pref.on !== false;
  pref.vol = Math.max(0, Math.min(1, Number(pref.vol) || 0));
  const savePref = () => { try { localStorage.setItem(KEY, JSON.stringify(pref)); } catch (e) {} };

  const BPM = 80, S16 = 60 / BPM / 4;
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const rnd = Math.random;
  const PENT = [67, 69, 72, 74, 76, 79]; // Sol La Đô Rê Mi Sol: ngũ cung, nghe quen tai

  // mỗi hợp âm: [nốt bass, hợp âm đàn phím, nốt cho giai điệu]
  const PROGS = {
    a: [[36, [52, 55, 59, 62], PENT], [33, [52, 55, 59, 60], PENT], [38, [53, 57, 60, 64], PENT], [43, [53, 59, 62, 64], [67, 69, 71, 74, 76]]], // sáng, ấm
    m: [[33, [52, 55, 59, 60], PENT], [29, [57, 60, 64, 67], PENT], [38, [53, 57, 60, 64], PENT], [40, [56, 59, 62, 65], [68, 71, 74, 76, 80]]], // tăng ca: thấp thỏm hơn
    d: [[41, [57, 60, 64, 67], PENT], [40, [55, 59, 62, 64], PENT], [45, [55, 59, 60, 64], PENT], [43, [59, 62, 64, 69], [67, 69, 71, 74, 76]]], // nghỉ ngơi: mơ màng
  };
  // d: trống, k: đàn phím, m: giai điệu, b: bass, p: pad. kp/bp: nhịp đàn phím và bass theo ô 16
  const MOODS = {
    menu: { d: 0.5, k: 1, m: 0.9, b: 0.85, p: 0.55, prog: 'a', dens: 3, kp: { 0: 1, 6: 0.55, 10: 0.5 }, bp: { 0: 1, 10: 0.7 }, kick: [0, 10], hat16: 0 },
    work: { d: 1, k: 1, m: 0.85, b: 1, p: 0.12, prog: 'a', dens: 4, kp: { 0: 1, 6: 0.55, 10: 0.5 }, bp: { 0: 1, 10: 0.7 }, kick: [0, 10], hat16: 0.15 },
    ot: { d: 1.15, k: 0.85, m: 0.55, b: 1, p: 0.08, prog: 'm', dens: 3, kp: { 0: 0.9, 4: 0.5, 8: 0.6, 14: 0.4 }, bp: { 0: 1, 6: 0.6, 10: 0.8 }, kick: [0, 6, 10], hat16: 0.5 },
    rest: { d: 0, k: 0.8, m: 0.6, b: 0.75, p: 1, prog: 'd', dens: 2, kp: { 0: 0.8, 8: 0.45 }, bp: { 0: 0.8 }, kick: [], hat16: 0 },
  };

  let ac = null, pre, lp, master, gDrums, gKeys, gMel, gBass, gPad, gFx, keyF, noiseBuf;
  let timer = null, nextT = 0, step = 0, bar = 0;
  let mood = 'menu', paused = false;
  let M = MOODS.menu, prog = PROGS.a, ch = PROGS.a[0], motif = null, mel = [];

  const level = () => (pref.on ? Math.pow(pref.vol, 1.6) * (paused ? 0.55 : 1) * 1.1 : 0);

  function build() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ac = new AC();
    const g = () => ac.createGain();
    pre = g(); lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200; lp.Q.value = 0.6;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -20; comp.knee.value = 24; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.25;
    master = g(); master.gain.value = 0;
    pre.connect(lp); lp.connect(comp); comp.connect(master); master.connect(ac.destination);
    gDrums = g(); gKeys = g(); gMel = g(); gBass = g(); gPad = g(); gFx = g();
    [gDrums, gKeys, gMel, gBass, gPad].forEach((n) => { n.gain.value = 0; n.connect(pre); });
    gFx.gain.value = 0.6; gFx.connect(pre);
    keyF = ac.createBiquadFilter(); keyF.type = 'lowpass'; keyF.frequency.value = 2200; keyF.connect(gKeys);
    // vang dội kiểu băng cát-xét cho giai điệu (lùi 3 nốt móc kép)
    const dly = ac.createDelay(1.5); dly.delayTime.value = 3 * S16;
    const fb = g(); fb.gain.value = 0.32;
    const fbf = ac.createBiquadFilter(); fbf.type = 'lowpass'; fbf.frequency.value = 1900;
    const send = g(); send.gain.value = 0.3;
    gMel.connect(send); send.connect(dly); dly.connect(fbf); fbf.connect(fb); fb.connect(dly); dly.connect(pre);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return true;
  }

  /* --- âm sắc --- */
  function tone(type, f, t, decay, peak, atk, out, det) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; if (det) o.detune.value = det;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t + atk + decay);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t + atk + decay + 0.05);
  }
  function noiseHit(t, v, type, freq, q, dur, out) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = ac.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
    s.connect(f); f.connect(g); g.connect(out);
    s.start(t, rnd() * 1.5); s.stop(t + dur + 0.02);
  }
  function keys(notes, t, vel) { // đàn phím điện kiểu Rhodes
    notes.forEach((n, i) => {
      const tt = t + i * 0.014 + rnd() * 0.006, f = hz(n);
      tone('sine', f, tt, 1.7, 0.07 * vel, 0.012, keyF);
      tone('triangle', f, tt, 0.9, 0.035 * vel, 0.012, keyF, 5);
      tone('sine', f * 2, tt, 0.35, 0.012 * vel, 0.005, keyF);
    });
  }
  function pluck(n, t, vel) { // nốt gảy, hơi giống đàn tranh
    const f = hz(n), g = ac.createGain(), fl = ac.createBiquadFilter();
    fl.type = 'lowpass'; fl.frequency.setValueAtTime(3200, t); fl.frequency.exponentialRampToValueAtTime(700, t + 0.5);
    const o1 = ac.createOscillator(), o2 = ac.createOscillator(), g2 = ac.createGain();
    o1.type = 'triangle'; o1.frequency.value = f; o2.type = 'sine'; o2.frequency.value = f * 2; g2.gain.value = 0.3;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.15 * vel, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 1);
    o1.connect(fl); o2.connect(g2); g2.connect(fl); fl.connect(g); g.connect(gMel);
    o1.start(t); o2.start(t); o1.stop(t + 1.05); o2.stop(t + 1.05);
  }
  function pad(notes, t, dur) {
    notes.forEach((n) => [-4, 4].forEach((det) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = hz(n); o.detune.value = det;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.045, t + 1.1); g.gain.linearRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(gPad); o.start(t); o.stop(t + dur + 0.05);
    }));
  }
  function bass(n, t, vel) {
    const f = hz(n);
    tone('sine', f, t, 0.9, 0.26 * vel, 0.01, gBass);
    tone('triangle', f, t, 0.7, 0.09 * vel, 0.01, gBass);
    tone('sine', f * 2, t, 0.4, 0.04 * vel, 0.01, gBass); // nghe rõ hơn trên loa điện thoại
  }
  function kick(t, v) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
    g.gain.setValueAtTime(0.75 * v, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    o.connect(g); g.connect(gDrums); o.start(t); o.stop(t + 0.35);
  }

  /* --- sắp xếp từng ô nhịp --- */
  function planMelody() {
    mel = [];
    if (M.m < 0.05 || rnd() < 0.22) return; // thỉnh thoảng nghỉ cho dễ thở
    const len = ch[2].length;
    if (motif && rnd() < 0.55) { mel = motif.map(([s, i]) => [s, Math.min(i, len - 1)]); return; }
    const slots = [0, 2, 3, 6, 8, 10, 11, 14].sort(() => rnd() - 0.5).slice(0, M.dens + (rnd() < 0.4 ? 1 : 0)).sort((a, b) => a - b);
    let idx = 1 + Math.floor(rnd() * 4);
    mel = slots.map((s) => {
      idx = Math.max(0, Math.min(len - 1, idx + [-2, -1, -1, 0, 1, 1, 2][Math.floor(rnd() * 7)]));
      return [s, idx];
    });
    motif = mel.map((x) => x.slice());
  }
  function barStart(t) {
    M = MOODS[mood] || MOODS.menu;
    if (bar % 4 === 0) prog = PROGS[M.prog];
    ch = prog[bar % 4];
    const T = (g, v) => g.gain.setTargetAtTime(v, t, 0.45);
    T(gDrums, M.d * 0.8); T(gKeys, M.k); T(gMel, M.m); T(gBass, M.b); T(gPad, M.p);
    planMelody();
    if (M.p > 0.05) pad(ch[1], t, 3.4);
  }
  function playStep(s, t0) {
    if (s === 0) barStart(t0);
    const t = t0 + (s % 4 === 2 ? 0.03 : 0) + (rnd() - 0.5) * 0.008; // swing nhẹ + chút "người chơi"
    if (M.k > 0.05 && M.kp[s] && (s === 0 || rnd() < 0.85)) keys(ch[1], t, M.kp[s]);
    if (M.b > 0.05 && M.bp[s] && (s === 0 || rnd() < 0.9)) bass(ch[0], t, M.bp[s]);
    for (const [slot, i] of mel) if (slot === s) pluck(ch[2][i], t, 0.8 + rnd() * 0.3);
    if (M.d > 0.05) {
      if (M.kick.includes(s) || (s === 7 && rnd() < 0.25)) kick(t, s === 0 ? 1 : 0.8);
      if (s === 4 || s === 12) {
        noiseHit(t, 0.3, 'bandpass', 1900, 0.8, 0.14, gDrums);
        tone('triangle', 190, t, 0.09, 0.1, 0.001, gDrums);
      }
      if (s % 2 === 0) noiseHit(t, s % 4 === 2 ? 0.1 : 0.06, 'highpass', 7500, 0.7, 0.045, gDrums);
      else if (rnd() < M.hat16) noiseHit(t, 0.04, 'highpass', 8000, 0.7, 0.03, gDrums);
      if (s === 14 && rnd() < 0.3) noiseHit(t, 0.07, 'highpass', 7000, 0.7, 0.18, gDrums);
    }
    if (rnd() < 0.12) noiseHit(t + rnd() * S16, 0.05, 'highpass', 3000, 1, 0.008, gFx); // tiếng lạo xạo đĩa than
  }
  function pump() {
    if (!ac || ac.state !== 'running') return;
    const now = ac.currentTime;
    if (nextT < now - 0.2) nextT = now + 0.05; // bắt nhịp lại sau khi bị tạm dừng
    while (nextT < now + 0.16) {
      playStep(step, nextT);
      step = (step + 1) % 16; if (step === 0) bar++;
      nextT += S16;
    }
  }

  /* --- điều khiển --- */
  function applyPause() {
    if (!ac) return;
    const t = ac.currentTime;
    lp.frequency.setTargetAtTime(paused ? 900 : 5200, t, 0.25); // tạm dừng game: nhạc nhỏ lại, đục đi
    master.gain.setTargetAtTime(level(), t, 0.3);
  }
  function play() {
    if (!pref.on) return;
    if (!ac && !build()) return;
    if (ac.state !== 'running') ac.resume().catch(() => {});
    if (timer && ac.state === 'running') return;
    if (!timer) { nextT = ac.currentTime + 0.12; step = 0; bar = 0; timer = setInterval(pump, 25); }
    applyPause();
  }
  function halt() {
    if (timer) { clearInterval(timer); timer = null; }
    if (!ac) return;
    master.gain.setTargetAtTime(0, ac.currentTime, 0.15);
    const a = ac;
    setTimeout(() => { if (!pref.on && a.state === 'running') a.suspend().catch(() => {}); }, 700);
  }
  function toggle() { pref.on = !pref.on; savePref(); if (pref.on) play(); else halt(); return pref.on; }
  function setVol(v) { pref.vol = Math.max(0, Math.min(1, v)); savePref(); applyPause(); }
  function sync(m, p) {
    mood = MOODS[m] ? m : 'menu';
    if (p !== paused) { paused = p; applyPause(); }
  }

  // trình duyệt chỉ cho phát âm thanh sau cú chạm đầu tiên
  ['pointerdown', 'touchend', 'keydown', 'click'].forEach((ev) => document.addEventListener(ev, play, { capture: true, passive: true }));
  document.addEventListener('visibilitychange', () => {
    if (!ac) return;
    if (document.hidden) ac.suspend().catch(() => {});
    else if (pref.on) ac.resume().catch(() => {});
  });

  return { pref, toggle, setVol, sync };
})();

function bgmSync() {

    m = G.over ? 'rest' : (st === 'work' || st === 'lunch') ? 'work' : st === 'ot' ? 'ot' : 'rest';
    p = !running && !(tab === 'company' && (subs.company === 'settings' || subs.company === 'feedback'));

};

let _fb = null, _fbAuth = null, _fbDb = null, _fbReady = false;
let accUser = null;          // Firebase user object
let accModal = false;
let accTab = 'login';        // 'login' | 'register'
let accEmail = '', accPass = '', accPassConfirm = '';
let accError = '', accLoading = false;
let cloudSyncing = false, cloudLastSync = 0;

function fbInit() {
  if (_fb) return true;
  if (typeof firebase === 'undefined') {
    console.warn('[CloudSave] Firebase SDK chưa load xong.');
    return false;
  }
  try {
    _fb = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
    _fbAuth = firebase.auth();
    _fbDb = firebase.database();
    _fbAuth.onAuthStateChanged((user) => {
      accUser = user;
      _fbReady = true;
      cloudLastSync = 0; // reset để show "chưa đồng bộ"
      render();
    });
    return true;
  } catch (e) {
    console.error('[CloudSave] Firebase init error:', e);
    return false;
  }
}

function fmtAuthError(code) {
  const map = {
    'auth/invalid-email': 'Email không hợp lệ.',
    'auth/user-not-found': 'Tài khoản không tồn tại.',
    'auth/wrong-password': 'Sai mật khẩu.',
    'auth/invalid-credential': 'Email hoặc mật khẩu không đúng.',
    'auth/email-already-in-use': 'Email này đã được dùng.',
    'auth/weak-password': 'Mật khẩu quá yếu (ít nhất 6 ký tự).',
    'auth/too-many-requests': 'Thử lại quá nhiều lần. Vui lòng thử sau.',
    'auth/network-request-failed': 'Lỗi kết nối mạng.',
    'auth/configuration-not-found': 'Firebase chưa được cấu hình. Liên hệ nhà phát triển.',
  };
  return map[code] || ('Lỗi: ' + code);
}

async function accLogin() {
  const email = accEmail.trim();
  if (!email || !accPass) { accError = 'Vui lòng nhập email và mật khẩu.'; render(); return; }
  if (!fbInit()) { accError = 'Không kết nối được Firebase. Thử lại sau.'; render(); return; }
  accLoading = true; accError = ''; render();
  try {
    await _fbAuth.signInWithEmailAndPassword(email, accPass);
    accModal = false; accPass = '';
    toast('Đã đăng nhập! ☁️ Bấm "Tải từ Cloud" để khôi phục tiến trình.');
  } catch (e) { accError = fmtAuthError(e.code); }
  accLoading = false; render();
}

async function accRegister() {
  const email = accEmail.trim();
  if (!email || !accPass) { accError = 'Vui lòng nhập email và mật khẩu.'; render(); return; }
  if (accPass !== accPassConfirm) { accError = 'Mật khẩu nhập lại không khớp.'; render(); return; }
  if (!fbInit()) { accError = 'Không kết nối được Firebase. Thử lại sau.'; render(); return; }
  accLoading = true; accError = ''; render();
  try {
    await _fbAuth.createUserWithEmailAndPassword(email, accPass);
    accModal = false; accPass = ''; accPassConfirm = '';
    toast('Tạo tài khoản thành công! ☁️ Đang tự lưu game lên Cloud…');
    await cloudSave();
  } catch (e) { accError = fmtAuthError(e.code); }
  accLoading = false; render();
}

async function accLogout() {
  if (_fbAuth) await _fbAuth.signOut();
  accUser = null; cloudLastSync = 0;
  toast('Đã đăng xuất tài khoản.');
  render();
}

async function cloudSave() {
  if (!accUser || !G || !_fbDb) return;
  cloudSyncing = true; render();
  try {
    const saveData = {
      save: JSON.stringify(G),
      ts: Date.now(),
      boss: G.boss,
      company: G.company,
      day: G.day,
      version: '3.5'
    };
    await _fbDb.ref('saves/' + accUser.uid).set(saveData);
    cloudLastSync = Date.now();
    toast('Đã lưu lên Cloud ☁️ (' + new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ')');
  } catch (e) {
    toast('Lỗi lưu Cloud: ' + e.message);
  }
  cloudSyncing = false; render();
}

async function cloudLoad() {
  if (!accUser || !_fbDb) return;
  cloudSyncing = true; render();
  try {
    const snap = await _fbDb.ref('saves/' + accUser.uid).get();
    if (!snap.exists()) {
      toast('Chưa có dữ liệu trên Cloud. Hãy lưu game lên trước.');
      cloudSyncing = false; render(); return;
    }
    const data = snap.val();
    const g = E.migrate(JSON.parse(data.save));
    if (running) stopRun();
    G = g;
    saveCode = null; // reset code
    save();
    sform = { boss: G.boss, co: G.company };
    tab = 'company'; cloudLastSync = Date.now();
    toast('Đã tải từ Cloud ☁️ — ' + esc(G.company) + ' (ngày ' + G.day + ')');
  } catch (e) {
    toast('Lỗi tải Cloud: ' + e.message);
  }
  cloudSyncing = false; render();
}

// Tự động lưu Cloud sau mỗi lần save local (nếu đang đăng nhập)
const _origSave = typeof save === 'function' ? save : null;
// Hook vào save() — được gọi lại mỗi 10 phút (local) => cũng lưu cloud
let _cloudAutoTimer = null;
function startCloudAutoSave() {
  if (_cloudAutoTimer) clearInterval(_cloudAutoTimer);
  _cloudAutoTimer = setInterval(() => {
    if (accUser && G && !cloudSyncing) cloudSave();
  }, 15 * 60 * 1000); // 15 phút
}
startCloudAutoSave();

// ---- Account Modal HTML ----
function accountModalHtml() {
  if (!accModal) return '';
  const isLogin = accTab === 'login';
  return `<div class="acc-overlay" id="acc-overlay">
    <div class="acc-card" id="acc-card">
      <div class="acc-title">
        <h2>☁️ Tài khoản Cloud</h2>
        <button class="acc-close" data-a="accClose" title="Đóng">✕</button>
      </div>
      <div class="acc-tabs">
        <button class="${isLogin ? 'active' : ''}" data-a="accTabLogin">Đăng nhập</button>
        <button class="${!isLogin ? 'active' : ''}" data-a="accTabReg">Đăng ký</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <input class="acc-input" type="email" id="acc-email"
          placeholder="Email của bạn" value="${esc(accEmail)}" autocomplete="email">
        <input class="acc-input" type="password" id="acc-pass"
          placeholder="Mật khẩu (ít nhất 6 ký tự)" value="${esc(accPass)}"
          autocomplete="${isLogin ? 'current-password' : 'new-password'}">
        ${!isLogin ? `<input class="acc-input" type="password" id="acc-pc"
          placeholder="Nhập lại mật khẩu" value="${esc(accPassConfirm)}" autocomplete="new-password">` : ''}
      </div>
      ${accError ? `<span class="acc-error">${esc(accError)}</span>` : ''}
      <button class="btn${accLoading ? ' ghost' : ''}" data-a="${isLogin ? 'accLogin' : 'accRegister'}" ${accLoading ? 'disabled' : ''}>
        ${accLoading ? '<span class="sync-spin">⟳</span> Đang xử lý…' : (isLogin ? '🔑 Đăng nhập' : '🚀 Tạo tài khoản')}
      </button>
      <p class="acc-note">Tiến trình game được lưu an toàn trên Cloud.<br>Chơi trên nhiều thiết bị mà không lo mất dữ liệu.</p>
    </div>
  </div>`;
}

// ---- Cloud Save Card (hiển thị trong Settings) ----
function cloudSaveCard() {
  if (!accUser) {
    return `<div class="card">
      <span class="val">☁️ Lưu tiến trình Cloud</span>
      <span class="sub">Đăng nhập để lưu game trên đám mây — chơi tiếp trên bất kỳ thiết bị nào mà không sợ mất dữ liệu.</span>
      ${btn('Đăng nhập / Đăng ký tài khoản', 'accOpen', { kind: '' })}
    </div>`;
  }
  const syncStr = cloudLastSync
    ? 'Lần cuối lưu: ' + new Date(cloudLastSync).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })
    : 'Chưa đồng bộ trong phiên này.';
  const spinning = `<span class="sync-spin">⟳</span> `;
  return `<div class="card">
    <div class="row between">
      <span class="val">☁️ ${esc(accUser.email)}</span>
      ${btn('Đăng xuất', 'accLogout', { sm: true, kind: 'ghost' })}
    </div>
    <span class="sub">${syncStr} · Tự động lưu mỗi 15 phút.</span>
    <div class="row">
      ${btn(cloudSyncing ? spinning + 'Đang lưu…' : '⬆ Lưu lên Cloud', 'cloudSave', { sm: true })}
      ${btn(cloudSyncing ? spinning + 'Đang tải…' : '⬇ Tải từ Cloud', 'cloudLoad', { sm: true, kind: 'ghost' })}
    </div>
  </div>`;
}

// ---- Account badge for hero screen ----
function accBadgeHtml() {
  if (!accUser) {
    return `<button class="acc-user-badge" data-a="accOpen" title="Đăng nhập Cloud Save">
      <span class="acc-dot offline"></span>
      <span>Chưa đăng nhập</span>
    </button>`;
  }
  return `<button class="acc-user-badge" data-a="accOpen" title="Tài khoản Cloud">
    <span class="acc-dot"></span>
    <span style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(accUser.email)}</span>
  </button>`;
}

load();
render();
if ('serviceWorker' in navigator && navigator.serviceWorker && /^https?:$/.test(location.protocol)) { navigator.serviceWorker.register('sw.js').catch(() => {}); }

</script>
